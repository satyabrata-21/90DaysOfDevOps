services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    #restart: always
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      service: "database"
  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network
    labels:
      service: "cache"
  web:
    #build: .
    #container_name: node_app
    image: node:20
    #container_name: node_app
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: appdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres: 
        condition: service_healthy
    labels:
      service: "web"
     


 
volumes:
  postgres_data:

networks:
    app-network:
